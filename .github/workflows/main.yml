name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: "Build, validate and pack"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate
        run: npx streamdeck validate --no-update-check com.pksimeonov.denon-receiver.sdPlugin

      - name: Pack
        run: npx streamdeck pack --no-update-check com.pksimeonov.denon-receiver.sdPlugin

      - name: Upload plugin
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            *.streamDeckPlugin
